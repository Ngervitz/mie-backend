<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Programa de Afiliados Credizona</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    Invitación al programa de afiliados Credizona: recomendá y ganá hasta $2.500.
  </div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f6f8;">
    <tr>
      <td align="center" style="padding:16px 12px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;margin:0 auto;">
          <tr>
            <td align="center" style="padding:0;">
              <a href="{{join_url}}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;border:0;">
                <img
                  src="{{hero_image_url}}"
                  alt="Programa por invitación Credizona: recomendá a 5 amigos y ganá hasta $2.500. Tocá para participar."
                  width="600"
                  style="display:block;width:100%;max-width:600px;height:auto;border:0;line-height:100%;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;"
                />
              </a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 8px 8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#1a3a4a;">
              <p style="margin:0 0 8px;">
                Si no ves la imagen,
                <a href="{{join_url}}" target="_blank" rel="noopener noreferrer" style="color:#0d7a5f;font-weight:bold;">participá acá en el programa de afiliados</a>.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6b7280;">
              <p style="margin:0;">
                La recompensa corresponde a préstamos efectivamente otorgados a nuevos clientes, según los
                <a href="{{terms_url}}" target="_blank" rel="noopener noreferrer" style="color:#6b7280;text-decoration:underline;">términos y condiciones</a>
                del programa (<code style="font-size:11px;">affiliate_v2</code>).
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
