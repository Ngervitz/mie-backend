}
 
function ocultarColumna(num,ver) {
  dis= ver ? '' : 'none';
  fila=document.getElementById('tabla').getElementsByTagName('tr');
  for(i=0;i<fila.length;i++){
    fila[i].getElementsByTagName('td')[num].style.display=dis;
  }
}
 
function colXGrupos(param){
     var objL = document.getElementById('rbtMonsL');
     var objR = document.getElementById('rbtMonsR');
	  if(param == "MNP_MEP") {
	    ocultarColumna(1,true);
	    ocultarColumna(2,true);
	    ocultarColumna(3,false);
	    ocultarColumna(4,false);
       objL.value='A';
       objR.value='A';
                               
	   } 
        
	   if(param == "MNP_MED") {
	    ocultarColumna(1,true);
	    ocultarColumna(2,false);
	    ocultarColumna(3,false);
	    ocultarColumna(4,true);
       objL.value='B';
       objR.value='B';
	                           
	   }
       
	   if(param == "MND_MED") {
	    ocultarColumna(1,false);
	    ocultarColumna(2,false);
	    ocultarColumna(3,true);
	    ocultarColumna(4,true);
       objL.value='D';
       objR.value='D';
	                           
	   }
	   ocultarColumnaXInst(param);
	}
	 
	function ocultarColumnaXInst(param) {
	  for(j=0;j<=20;j++){
	     if (document.getElementById('XInst'+j) != null){
	        fila=document.getElementById('XInst'+j).getElementsByTagName('tr');
	        if(param == "MNP_MEP") {
	            for(i=0;i<fila.length;i++){
	                fila[i].getElementsByTagName('td')[1].style.display='';
	                fila[i].getElementsByTagName('td')[2].style.display='';
	                fila[i].getElementsByTagName('td')[3].style.display='none';
	                fila[i].getElementsByTagName('td')[4].style.display='none';
	            }
	        }
	        if(param == "MNP_MED") {
	            for(i=0;i<fila.length;i++){
	                fila[i].getElementsByTagName('td')[1].style.display='';
	                fila[i].getElementsByTagName('td')[2].style.display='none';
	                fila[i].getElementsByTagName('td')[3].style.display='none';
	                fila[i].getElementsByTagName('td')[4].style.display='';
	            }
	        }
	        if(param == "MND_MED") {
	            for(i=0;i<fila.length;i++){
	                fila[i].getElementsByTagName('td')[1].style.display='none';
	                fila[i].getElementsByTagName('td')[2].style.display='none';
	                fila[i].getElementsByTagName('td')[3].style.display='';
	                fila[i].getElementsByTagName('td')[4].style.display='';
	            }
	        }
	                                                              
	     }else{
	        return true;
	     }
	  }
	}
	 
    
	function Abrir_CerrarTodo(param) {
	  var obj;
	  var display;
	  var signo_mas = new Image();
	  var signo_menos = new Image();
	  signo_mas.src = "../images/mas.gif";
	  signo_menos.src = "../images/menos.gif";
	  
	  for(j=0;j<=20;j++){
	    if (document.getElementById('divXInst'+j) != null){
	      obj = document.getElementById('divXInst'+j);
	      if(param == "MOSTRARTODO") {
	        document.images['imgINST'+j].src = signo_menos.src;
	        obj.style.display = "";
	      }
	      if(param == "OCULTARTODO") {
		     document.images['imgINST'+j].src = signo_mas.src;
		     obj.style.display = "none";
	      }
	    }else{
	      return;
		}
	  }
	}
   
function mostrar(id,image) {
  var obj = document.getElementById(id);
  var display = obj.style.display;
  var signo_mas = new Image();
  var signo_menos = new Image();
  signo_mas.src = "../images/mas.gif";
  signo_menos.src = "../images/menos.gif";
  
  if(display == "none") {
     display = "";
     document.images[image].src = signo_menos.src;
  }else {
	  display = "none"
	  document.images[image].src = signo_mas.src;
  }
  obj.style.display = display;
}
 
function init(){
	populate();
}
 
function populate(){
   colXGrupos('MNP_MEP');
}
