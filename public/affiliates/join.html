<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programa de Afiliados — Credizona</title>
  <link rel="stylesheet" href="/affiliates/affiliates.css" />
</head>
<body>
  <header class="site-header">
    <img src="/affiliates/logo.svg" alt="Credizona" width="200" height="40" />
  </header>
  <main class="page">
    <section class="join-hero" id="program-info">
      <picture class="join-hero__picture">
        <source
          media="(min-width: 768px)"
          srcset="/affiliates/assets/banner-afiliados-desktop.png"
        />
        <img
          class="join-hero__img"
          src="/affiliates/assets/programa-afiliados-mobile.png"
          alt="Programa de Afiliados Credizona"
          width="1024"
          height="1536"
          decoding="async"
        />
      </picture>
      <a class="terms-link join-hero__terms" href="/affiliates/terms" target="_blank" rel="noopener">
        Leer términos y condiciones completos
      </a>
    </section>

    <section class="card panel" id="join-panel" hidden>
      <div id="join-status" class="status-msg status-msg--info" hidden></div>

      <div id="step-terms">
        <p class="phone-hint" id="phone-masked" hidden></p>
        <label class="checkbox-row">
          <input type="checkbox" id="accept-terms" />
          <span>
            Leí y acepto los
            <a href="/affiliates/terms" target="_blank" rel="noopener">Términos y Condiciones</a>
            del Programa de Afiliados Credizona (versión <span id="terms-version-label">affiliate_v3</span>).
          </span>
        </label>
        <div class="btn-row" style="margin-top: 16px">
          <button type="button" class="btn btn--primary" id="btn-send-otp" disabled>
            Enviar código por SMS
          </button>
        </div>
      </div>

      <div id="step-otp" hidden>
        <p class="phone-hint">Ingresá el código de 6 dígitos que enviamos a tu celular.</p>
        <div class="field">
          <label for="otp-input">Código</label>
          <input type="text" id="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" />
        </div>
        <button type="button" class="btn btn--primary" id="btn-verify-otp">
          Verificar y completar registro
        </button>
      </div>

      <div id="step-success" hidden>
        <p><strong>¡Listo!</strong> Este es tu enlace personal para recomendar Credizona:</p>
        <div class="referral-box" id="referral-url"></div>
        <div class="btn-row btn-row--split">
          <button type="button" class="btn btn--secondary" id="btn-copy-link">Copiar enlace</button>
          <a class="btn btn--primary" id="btn-whatsapp" href="#" rel="noopener" target="_blank">
            Compartir por WhatsApp
          </a>
        </div>
      </div>
    </section>
  </main>
  <script src="/affiliates/join.js" defer></script>
</body>
</html>
