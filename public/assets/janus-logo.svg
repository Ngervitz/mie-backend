<svg viewBox="0 0 460 140" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Janus</title>

  <g transform="translate(70,70)">
    <!-- left diamond - teal -->
    <polygon points="-6,-70 -56,-14 -6,10" fill="#5DCAA5"/>
    <polygon points="-56,-14 -6,10 -36,52" fill="#1D9E75"/>
    <polygon points="-6,10 -36,52 -6,70" fill="#0F6E56"/>

    <!-- right diamond - magenta/pink -->
    <polygon points="6,-70 56,-14 6,10" fill="#ED93B1"/>
    <polygon points="56,-14 6,10 36,52" fill="#D4537E"/>
    <polygon points="6,10 36,52 6,70" fill="#993556"/>

    <line x1="0" y1="-70" x2="0" y2="70" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <text x="150" y="70" fill="#2C2C2A" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" letter-spacing="2" dominant-baseline="middle">JANUS</text>
  <text x="150" y="94" fill="#5F5E5A" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1" dominant-baseline="middle">MARKET INTELLIGENCE</text>
</svg>
